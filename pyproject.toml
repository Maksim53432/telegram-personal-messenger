[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-personal-messenger"
version = "0.2.0"
description = "Личный клиент Telegram с тёмным интерфейсом на Tkinter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Telethon==1.45.0", "python-dotenv==1.2.4", "python-socks==3.2.1", "Pillow==13.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
